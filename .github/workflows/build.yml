name: APK 빌드

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: 테스트와 APK 빌드
        run: ./gradlew testDebugUnitTest assembleRelease
      - name: APK 이름 정리
        run: cp app/build/outputs/apk/release/app-release.apk my-voice-tts.apk
      - uses: actions/upload-artifact@v4
        with:
          name: my-voice-tts-apk
          path: my-voice-tts.apk
      # main 브랜치에 합쳐지면 "최신 APK" 릴리스를 갱신한다 (휴대폰에서 바로 내려받기용)
      - name: 최신 릴리스 갱신
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 최신 APK
          prerelease: true
          files: my-voice-tts.apk
